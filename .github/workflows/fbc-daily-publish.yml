name: Publish daily FBC prices + ML predictions

on:
  schedule:
    # Hourly, 06:00–22:00 Harare time (UTC+2 -> 04:00-20:00 UTC), weekdays only.
    # FBC's actual send time has been drifting later (observed as late as
    # ~16:52 Harare in practice), so this window runs well past that with
    # margin. The script itself searches the last several days (not just
    # "today"), so a still-later send just gets picked up on the next tick
    # rather than being silently missed until the following day.
    - cron: '0 4-20 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
    # re-armed 2026-08-31 -- trivial edit to force GitHub to re-register the cron schedule after it silently stopped firing

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl pandas scikit-learn

      - name: Fetch + parse + archive today's sheet, write market-data.json
        id: publish
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/publish_fbc_prices.py

      - name: Retrain + write predictions.json from the accumulated sheet history
        run: python scripts/generate_predictions.py

      - name: Commit and push if anything changed
        run: |
          git add market-data.json predictions.json data/fbc-sheets
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi
          git config user.name "fbc-price-bot"
          git config user.email "actions@users.noreply.github.com"
          PRICE_DATE=$(python -c "import json;print(json.load(open('market-data.json'))['priceDate'])")
          git commit -m "market-data + predictions: ${PRICE_DATE}"
          git push

      - name: Purge jsDelivr CDN cache
        if: success()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/market-data.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/predictions.json" || true
