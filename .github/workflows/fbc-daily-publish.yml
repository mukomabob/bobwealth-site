name: Publish daily FBC prices + ML predictions

on:
  schedule:
    # Hourly, 06:00-22:00 Harare time (UTC+2 -> 04:00-20:00 UTC), weekdays only.
    # Recreated under a new filename on 2026-08-31 after the original
    # fbc-daily-publish.yml's schedule trigger stopped firing (fired once on
    # 2026-08-27, then went silent through ~12+ elapsed windows) despite a
    # valid, unmodified cron and no Actions/billing restriction -- a known
    # GitHub Actions scheduler quirk where a workflow can silently fail to
    # re-arm. Recreating under a fresh path forces a clean registration.
    - cron: '0 4-20 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Optional: with both set, the chatbot's database (Cloudflare D1) is
      # rebuilt whenever a new sheet is published. See stock-agent/cloudflare/DEPLOY.md.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl pandas scikit-learn

      - name: Fetch + parse + archive today's sheet, write market-data.json
        id: publish
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/publish_fbc_prices.py

      - name: Retrain + write predictions.json from the accumulated sheet history
        run: python scripts/generate_predictions.py

      - name: Commit and push if anything changed
        id: commit
        run: |
          git add market-data.json predictions.json data/fbc-sheets
          if git diff --cached --quiet; then
            echo "Nothing changed -- skipping commit."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "fbc-price-bot"
          git config user.email "actions@users.noreply.github.com"
          PRICE_DATE=$(python -c "import json;print(json.load(open('market-data.json'))['priceDate'])")
          git commit -m "market-data + predictions: ${PRICE_DATE}"
          git push

      - name: Purge jsDelivr CDN cache
        if: success()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/market-data.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/predictions.json" || true

      # After the site is published, so a Cloudflare problem can never hold back
      # the day's prices. Runs only when this run committed new data.
      - name: Build the chatbot database from the sheet archive
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          python stock-agent/build_dataset.py data/fbc-sheets stock-agent/fbc_history.db
          python stock-agent/cloudflare/export_to_d1.py stock-agent/fbc_history.db stock-agent/cloudflare/d1_data.sql

      - name: Load it into Cloudflare D1
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: stock-agent/cloudflare
          command: d1 execute fbc-history --remote --file=d1_data.sql --yes
