# Cloudflare Worker config for the FBC stock-trend chat agent.
# See ../DEPLOY.md for the full step-by-step setup.

name = "fbc-stock-agent"
main = "worker.js"
compatibility_date = "2026-09-03"
# The Anthropic SDK imports a few Node built-ins (node:stream etc.); this flag
# lets the Workers runtime provide them.
compatibility_flags = ["nodejs_compat"]

# D1 (hosted SQLite) -- holds the `prices` table built from the 111 FBC
# sheets. Create with `npx wrangler d1 create fbc-history`, then paste the
# database_id it prints below (database_name must match too).
[[d1_databases]]
binding = "DB"
database_name = "fbc-history"
database_id = "2ea92d8b-8711-4d6e-89a2-878326f8da4d"

# Workers AI -- runs the text-to-SQL and SQL-to-answer steps. No separate
# API key needed; this binding is enough.
[ai]
binding = "AI"

# Sites allowed to call this Worker from a browser (comma-separated).
[vars]
ALLOWED_ORIGINS = "https://bobwealth.org,https://www.bobwealth.org"
# Free Workers AI model that writes the SQL (used when no ANTHROPIC_API_KEY is
# set). Chosen by comparing models with .github/workflows/sql-eval.yml.
SQL_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Econet's Caimex gateway (OpenAI-compatible, prepaid). Used for the SQL step
# when the CAIMEX_API_KEY secret is set and Claude isn't; empty model = off.
CAIMEX_BASE_URL = "https://caimex.econetai.co.zw:2052/v1"
CAIMEX_SQL_MODEL = "Caimex2/deepseek-ai/DeepSeek-V4-Flash"

# Per-IP rate limit: 10 questions per 60 seconds. Stops anyone scripting the
# endpoint from burning through the daily Workers AI allowance.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
