<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ask the listings · RE/MAX demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F8; --surface:#FFFFFF; --ink:#0E2747; --muted:#5B6B7F; --line:#DCE2EA;
    --accent:#C8102E; --accent-ink:#FFFFFF; --you:#0E2747; --you-ink:#FFFFFF; --chip:#E7ECF3;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0D1520; --surface:#16212F; --ink:#E8EEF6; --muted:#93A3B8; --line:#26354A;
      --accent:#E8384F; --accent-ink:#FFFFFF; --you:#2B4B78; --you-ink:#FFFFFF; --chip:#1E2C3E;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 "Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
  }
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:0 18px}
  header{border-bottom:1px solid var(--line);background:var(--surface)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .balloon{width:24px;height:24px;flex:none}
  h1{font:800 1.25rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
  .demo{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

  main{flex:1;overflow-y:auto}
  .intro{padding:44px 0 18px}
  .intro h2{font:800 clamp(2rem,7vw,3.1rem)/1.02 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 12px;max-width:14ch}
  .intro p{color:var(--muted);margin:0 0 22px;max-width:52ch}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font:inherit;font-size:.92rem;background:var(--chip);color:var(--ink);border:0;border-radius:10px;padding:9px 13px;cursor:pointer;text-align:left}
  .chip:hover{outline:1px solid var(--line)}

  #thread{display:flex;flex-direction:column;gap:14px;padding:18px 0 24px}
  .msg{max-width:88%;padding:11px 15px;border-radius:16px;white-space:normal;overflow-wrap:anywhere}
  .msg.you{align-self:flex-end;background:var(--you);color:var(--you-ink);border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.bot p{margin:0 0 8px}.msg.bot p:last-child{margin:0}
  .msg.bot ul{margin:4px 0 8px;padding-left:20px}
  .ref{font-size:.8em;color:var(--muted);white-space:nowrap}
  .msg.err{border-color:var(--accent);color:var(--accent)}
  .thinking{color:var(--muted);font-size:.92rem}

  .cards{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;margin-top:-4px}
  .card{flex:0 0 232px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px}
  .price{font:800 1.35rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
  .price small{font:500 .78rem "Public Sans",sans-serif;color:var(--muted)}
  .card-link{display:flex;flex-direction:column;gap:6px;flex:1;text-decoration:none;color:inherit} .card:hover{border-color:var(--accent)} .hdr-r{display:flex;align-items:center;gap:10px} .wa,.wa-card{display:inline-flex;align-items:center;justify-content:center;background:#25D366;color:#fff;font-weight:600;font-size:.85rem;border-radius:10px;padding:7px 12px;text-decoration:none;white-space:nowrap} .wa-card{margin-top:8px} .wa,.wa-card{border:0;cursor:pointer;font-family:inherit} .enquiry{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:8px 0 28px;scroll-margin-top:12px} .eq-head{display:flex;justify-content:space-between;align-items:center} .enquiry h3{font:800 1.3rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0} .eq-x{background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;cursor:pointer;padding:0 4px} .eq-sub{color:var(--muted);font-size:.9rem;margin:6px 0 14px} .eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .eq-grid label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)} .eq-grid .full{grid-column:1/-1} .eq-grid input,.eq-grid select,.eq-grid textarea{flex:none;font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%} .eq-grid textarea{resize:vertical} .eq-err{color:var(--accent);font-size:.9rem;margin:10px 0 0} .eq-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px} .eq-actions .wa{padding:11px 16px;font-size:.95rem} .eq-mail{font:600 .95rem "Public Sans",sans-serif;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 16px;cursor:pointer} @media (max-width:560px){.eq-grid{grid-template-columns:1fr}} .eq-summary{font-size:.85rem;color:var(--muted);margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center} .eq-chip{background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.8rem} .eq-more{margin-top:12px} .eq-more summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0} .eq-more .eq-grid{margin-top:10px} .eq-mail{border:0;background:none;color:var(--muted);text-decoration:underline;padding:11px 6px} @media (max-width:480px){.demo{display:none}} .card .t{font-weight:600;font-size:.93rem;line-height:1.3}
  .facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--muted)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;font-size:.78rem;color:var(--muted)}
  .status{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:600;align-self:flex-start}

  footer{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
  form{display:flex;gap:10px;padding-block:12px}
  input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  input:focus-visible,.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.send{font:600 .95rem "Public Sans",sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:default}

  [hidden]{display:none!important}
  @media (prefers-reduced-motion:no-preference){ .card{animation:rise .25s ease-out both} @keyframes rise{from{opacity:0;transform:translateY(6px)}} }
</style>
</head>
<body>


<header>
  <div class="wrap">
    <div class="brand">
      <svg class="balloon" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 12L13 3l10 9v11H16v-7h-6v7H3z" fill="var(--accent)"/></svg>
      <h1>Ask the listings</h1>
    </div>
    <div class="hdr-r"><span class="demo">Live RE/MAX listings</span><a class="wa" href="#enquiry" id="contactBtn">Contact Farai</a></div>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <section class="intro" id="intro">
      <h2>What are you looking for in Harare?</h2>
      <div class="chips" id="chips"></div>
    </section>
    <div id="thread" aria-live="polite"></div><section class="enquiry" id="enquiry" hidden><div class="eq-head"><h3>Next steps</h3><button type="button" class="eq-x" id="eqClose" aria-label="Close">&times;</button></div><p class="eq-sub">Leave your name and number and Farai Madondo at RE/MAX will get back to you about viewings.</p><div class="eq-grid"><label>Name &amp; surname<input id="eqName" autocomplete="name"></label><label>Mobile number<input id="eqPhone" type="tel" autocomplete="tel" placeholder="+263 7..."></label></div><p class="eq-summary" id="eqSummary" hidden></p><details class="eq-more"><summary>Add email, budget or a message (optional)</summary><div class="eq-grid"><label>Email<input id="eqEmail" type="email" autocomplete="email"></label><label>Subject<select id="eqSubject"><option>General enquiry</option><option>Buying</option><option>Renting</option><option>Selling my property</option><option>Property valuation</option></select></label><label>Budget (USD)<input id="eqBudget" placeholder="e.g. $300k or $2,000/month"></label><label>Preferred area<input id="eqArea" placeholder="e.g. Borrowdale, Avenues"></label><label class="full">Message<textarea id="eqMsg" rows="3"></textarea></label></div></details><p class="eq-err" id="eqErr" hidden></p><div class="eq-actions"><button type="button" class="wa" id="eqWa">Send to Farai on WhatsApp</button><button type="button" class="eq-mail" id="eqMail">Email instead</button></div></section>
  </div>
</main>

<footer>
  <div class="wrap">
    <form id="ask">
      <input id="q" placeholder="e.g. 4-bed house for sale under $300k" autocomplete="off" aria-label="Your question">
      <button class="send" id="sendBtn" type="submit">Ask</button>
    </form>
  </div>
</footer>

<script>
const WORKER_URL = "https://remax-listings.robertzata23.workers.dev"; // ← change after deploying worker.js

const WA_NUMBER = "263778867538"; const waLink = (t) => `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t)}`; const SUGGESTIONS = [
  "3-bed homes for sale under $300k",
  "Median house price by suburb",
  "What’s new this week?",
  "Rentals under $2,500 a month",
  "Houses for sale in Glen Lorne",
  "Houses with a borehole and solar",
];

const $ = (id) => document.getElementById(id);
const thread = $("thread"), main = $("main");
const chatLog = [];

SUGGESTIONS.forEach((s) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = s;
  b.onclick = () => ask(s);
  $("chips").appendChild(b);
});

$("ask").addEventListener("submit", (e) => { e.preventDefault(); const v = $("q").value.trim(); if (v) ask(v); });

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
function md(text) {
  const lines = esc(text).split(/\n/);
  let html = "", list = false;
  for (let line of lines) {
    line = line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[(RMX-[A-Z]\d+)\]/g, '<span class="ref">$1</span>');
    if (/^\s*[-*•]\s+/.test(line)) { if (!list) { html += "<ul>"; list = true; } html += "<li>" + line.replace(/^\s*[-*•]\s+/, "") + "</li>"; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (line.trim()) html += "<p>" + line + "</p>";
  }
  return html + (list ? "</ul>" : "");
}
const usd = (n) => "$" + Number(n).toLocaleString("en-US");

function add(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  thread.appendChild(d); main.scrollTop = main.scrollHeight;
  return d;
}

function cards(listings) {
  if (!listings?.length) return;
  const row = document.createElement("div"); row.className = "cards";
  for (const l of listings) {
    const facts = [];
    if (l.bedrooms) facts.push(`${l.bedrooms} bed`);
    if (l.bathrooms) facts.push(`${l.bathrooms} bath`);
    if (l.stand_size_m2) facts.push(`${l.stand_size_m2.toLocaleString("en-US")} m² stand`);
    if (l.title_type) facts.push(l.title_type);
    row.insertAdjacentHTML("beforeend", `
      <div class="card"><a class="card-link" href="${esc(l.url || '#')}" target="_blank" rel="noopener" title="View on remax.co.za">
        ${l.status && l.status !== "Active" ? `<span class="status">${esc(l.status)}</span>` : ""}
        <div class="price">${usd(l.price_usd)}${l.price_period ? ` <small>${esc(l.price_period)}</small>` : ""}</div>
        <div class="t">${esc(l.title)}</div>
        <div class="facts">${facts.map((f) => `<span>${esc(f)}</span>`).join("")}</div>
        <div class="foot"><span>${esc(l.agent?.name || "")}</span><span>${esc(l.listing_ref)}</span></div>
      </a><button class="wa-card" type="button" data-ref="${esc(l.listing_ref)}">Enquire about this</button></div>`);
  }
  thread.appendChild(row); main.scrollTop = main.scrollHeight;
}

async function ask(text) {
  $("intro").hidden = true;
  $("q").value = ""; $("sendBtn").disabled = true;
  add("you", esc(text));
  chatLog.push({ role: "user", content: text });
  const wait = add("bot thinking", "Checking the listings…");

  if (WORKER_URL.includes("YOUR-SUBDOMAIN")) {
    wait.remove(); add("bot err", "The assistant isn’t connected yet. Set WORKER_URL in the script at the bottom of index.html to your Worker’s address.");
    chatLog.pop(); $("sendBtn").disabled = false; return;
  }
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: chatLog }),
    });
    const data = await res.json().catch(() => ({}));
    wait.remove();
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    chatLog.push({ role: "assistant", content: data.reply });
    add("bot", md(data.reply));
    cards(data.listings);
  } catch (e) {
    wait.remove(); chatLog.pop();
    add("bot err", "Couldn’t get an answer: " + esc(e.message) + ". Try again in a moment.");
  } finally {
    $("sendBtn").disabled = false; $("q").focus();
  }
}

// ---------- enquiry form: sends to Farai via WhatsApp or email ----------
const FARAI_EMAIL = "faraim@remaxzim.co.zw";
const enq = $("enquiry"); function renderSummary() { const parts = []; const s = $("eqSubject").value; if (s !== "General enquiry") parts.push(s); if ($("eqBudget").value.trim()) parts.push("Budget " + $("eqBudget").value.trim()); if ($("eqArea").value.trim()) parts.push($("eqArea").value.trim()); [...new Set($("eqMsg").value.match(/RMX-[A-Z]\d+/g) || [])].forEach((r) => parts.push(r)); $("eqSummary").innerHTML = parts.length ? "Farai will also see: " + parts.map((p) => `<span class="eq-chip">${esc(p)}</span>`).join("") : ""; $("eqSummary").hidden = !parts.length; } enq.addEventListener("input", renderSummary); enq.addEventListener("change", renderSummary);
function openEnquiry(prefill = {}) {
  enq.hidden = false;
  if (prefill.subject) $("eqSubject").value = prefill.subject;
  if (prefill.area && !$("eqArea").value) $("eqArea").value = prefill.area;
  const asked = chatLog.filter((m) => m.role === "user").map((m) => m.content);
  if (!$("eqBudget").value) {
    const m = asked.join(" ").match(/\$\s?[\d,.]+\s?(k|m)?(\s?(a|per) month)?/i);
    if (m) $("eqBudget").value = m[0];
  }
  if (prefill.listing) $("eqMsg").value = `I'm interested in ${prefill.listing}.` + ($("eqMsg").value ? "\n" + $("eqMsg").value : "");
  else if (!$("eqMsg").value && asked.length) $("eqMsg").value = "I was looking for: " + asked.slice(-3).join("; ");
  renderSummary(); enq.scrollIntoView({ behavior: "smooth", block: "start" });
  setTimeout(() => $("eqName").focus({ preventScroll: true }), 400);
}
function enquiryText() {
  const v = (id) => $(id).value.trim();
  return [
    "Hi Farai, I found you on the RE/MAX listings assistant.",
    `Name: ${v("eqName")}`,
    v("eqPhone") && `Mobile: ${v("eqPhone")}`,
    v("eqEmail") && `Email: ${v("eqEmail")}`,
    `Enquiry: ${v("eqSubject")}`,
    v("eqBudget") && `Budget: ${v("eqBudget")}`,
    v("eqArea") && `Preferred area: ${v("eqArea")}`,
    v("eqMsg") && `\n${v("eqMsg")}`,
  ].filter(Boolean).join("\n");
}
function checkEnquiry() {
  const name = $("eqName").value.trim(), phone = $("eqPhone").value.trim(), email = $("eqEmail").value.trim();
  const err = !name ? "Please add your name and surname."
    : !phone && !email ? "Please add a mobile number or email so Farai can reply." : "";
  $("eqErr").textContent = err; $("eqErr").hidden = !err;
  return !err;
}
$("contactBtn").addEventListener("click", (e) => { e.preventDefault(); openEnquiry(); });
$("eqClose").addEventListener("click", () => { enq.hidden = true; });
$("eqWa").addEventListener("click", () => {
  if (checkEnquiry()) window.open(waLink(enquiryText()), "_blank", "noopener");
});
$("eqMail").addEventListener("click", () => {
  if (!checkEnquiry()) return;
  const subj = `RE/MAX enquiry: ${$("eqSubject").value} - ${$("eqName").value.trim()}`;
  location.href = `mailto:${FARAI_EMAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(enquiryText())}`;
});
thread.addEventListener("click", (e) => {
  const b = e.target.closest(".wa-card"); if (!b) return;
  const card = b.closest(".card"), link = card.querySelector(".card-link");
  const title = card.querySelector(".t")?.textContent.trim() || "this property";
  const area = (title.match(/ in (.+)$/i) || [])[1];
  openEnquiry({ listing: `${title} (${b.dataset.ref}) ${link ? link.href : ""}`.trim(), area, subject: /rent/i.test(title) ? "Renting" : "Buying" });
});
</script>

</body>
</html>
