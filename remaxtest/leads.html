<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RE/MAX Leads">
<meta name="theme-color" content="#0E2747">
<title>RE/MAX Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#0E2747; --muted:#5B6B7F; --line:#DCE2EA;
  --accent:#C8102E; --chip:#E7ECF3; --wa:#25D366;
  --s-new:#C8102E; --s-contacted:#B7791F; --s-viewing:#2B6CB0; --s-offer:#6B46C1; --s-closed:#2F855A; --s-lost:#718096;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1520; --surface:#16212F; --ink:#E8EEF6; --muted:#93A3B8; --line:#26354A;
    --accent:#E8384F; --chip:#1E2C3E;
    --s-new:#F56565; --s-contacted:#ECC94B; --s-viewing:#63B3ED; --s-offer:#B794F4; --s-closed:#68D391; --s-lost:#A0AEC0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Public Sans",system-ui,-apple-system,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:800 1.6rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 .85rem "Public Sans",sans-serif;cursor:pointer}
.stats{display:flex;gap:8px;margin:12px 0 10px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.stat b{color:var(--ink);margin-left:4px}
.stat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.on b{color:var(--bg)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:10px;padding:6px 0 40px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:600;font-size:1.05rem}
.when{color:var(--muted);font-size:.8rem;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:.8rem}
.tag.budget{font-weight:600}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;color:#fff;white-space:nowrap}
.empty,.msg{color:var(--muted);text-align:center;padding:40px 12px}
.lock{max-width:360px;margin:16vh auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.lock p{color:var(--muted);margin:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font:600 1rem "Public Sans",sans-serif;cursor:pointer;background:var(--ink);color:var(--bg)}
.err{color:var(--accent);font-size:.9rem;min-height:1.2em}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0))}
.panel h2{font:800 1.4rem/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.actions a{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:12px 6px;font-weight:600;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.actions a.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.actions a[aria-disabled="true"]{opacity:.35;pointer-events:none}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;font-size:.95rem}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
dd a{color:inherit}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted);margin-top:12px}
.saved{color:var(--muted);font-size:.85rem;margin-top:8px;min-height:1.2em}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem;white-space:pre-wrap;margin:0 0 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <section class="lock" id="lock" hidden>
    <h1>RE/MAX Leads</h1>
    <p>Enter your PIN to see your customers.</p>
    <input id="pin" type="password" autocomplete="current-password" placeholder="PIN">
    <button class="btn" id="unlock" type="button">Unlock</button>
    <div class="err" id="pinErr"></div>
  </section>

  <section id="app" hidden>
    <header>
      <div class="top">
        <h1>Customers</h1>
        <div style="display:flex;gap:8px">
          <button class="icon-btn" id="refresh" type="button">Refresh</button>
          <button class="icon-btn" id="logout" type="button">Lock</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <input id="q" type="search" placeholder="Search name, area, budget, phone…" autocomplete="off">
    </header>
    <div class="list" id="list"></div>
  </section>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true"></div>
</div>

<script>
const API = "https://remax-listings.robertzata23.workers.dev/leads";
const STATUS_COLORS = { "New": "--s-new", "Contacted": "--s-contacted", "Viewing booked": "--s-viewing", "Offer made": "--s-offer", "Closed": "--s-closed", "Not interested": "--s-lost" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let leads = [], statuses = Object.keys(STATUS_COLORS), filter = "All";

const getPin = () => { try { return localStorage.getItem("remaxLeadsPin") || ""; } catch { return ""; } };
const setPin = (p) => { try { p ? localStorage.setItem("remaxLeadsPin", p) : localStorage.removeItem("remaxLeadsPin"); } catch {} };

async function api(method = "GET", body) {
  const res = await fetch(API, {
    method,
    headers: { "x-admin-key": getPin(), ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || `Error ${res.status}`); e.status = res.status; throw e; }
  return data;
}

function showLock(msg = "") { $("app").hidden = true; $("lock").hidden = false; $("pinErr").textContent = msg; $("pin").focus(); }
async function load() {
  try {
    const data = await api();
    leads = data.leads || []; statuses = data.statuses || statuses;
    $("lock").hidden = true; $("app").hidden = false;
    render();
  } catch (e) {
    if (e.status === 401) { setPin(""); showLock("That PIN didn't work."); }
    else if (!$("app").hidden) $("list").innerHTML = `<div class="msg">Couldn't load customers: ${esc(e.message)}</div>`;
    else showLock(e.message);
  }
}

const statusPill = (s) => `<span class="pill" style="background:var(${STATUS_COLORS[s] || "--s-lost"})">${esc(s || "New")}</span>`;
function when(ts) {
  if (!ts) return "";
  const d = new Date(ts.replace(" ", "T") + "Z"), days = Math.floor((Date.now() - d) / 864e5);
  if (days < 1) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (days < 7) return days === 1 ? "Yesterday" : `${days} days ago`;
  return d.toLocaleDateString([], { day: "numeric", month: "short" });
}

function render() {
  const counts = { All: leads.length };
  for (const l of leads) counts[l.status || "New"] = (counts[l.status || "New"] || 0) + 1;
  $("stats").innerHTML = ["All", ...statuses].filter((s) => s === "All" || counts[s])
    .map((s) => `<button class="stat${s === filter ? " on" : ""}" data-f="${esc(s)}">${esc(s)}<b>${counts[s] || 0}</b></button>`).join("");
  const q = $("q").value.trim().toLowerCase();
  const shown = leads.filter((l) => (filter === "All" || (l.status || "New") === filter) &&
    (!q || [l.name, l.phone, l.email, l.area, l.budget, l.subject, l.listings, l.notes].join(" ").toLowerCase().includes(q)));
  $("list").innerHTML = shown.length ? shown.map((l) => `
    <article class="lead" data-id="${l.id}">
      <div class="row"><span class="name">${esc(l.name)}</span>${statusPill(l.status)}</div>
      <div class="meta">
        ${l.budget ? `<span class="tag budget">${esc(l.budget)}</span>` : ""}
        ${l.area ? `<span class="tag">${esc(l.area)}</span>` : ""}
        ${l.subject && l.subject !== "General enquiry" ? `<span class="tag">${esc(l.subject)}</span>` : ""}
      </div>
      <div class="row"><span class="when">${esc(l.phone || l.email)}</span><span class="when">${when(l.created_at)}</span></div>
    </article>`).join("")
    : `<div class="empty">${leads.length ? "No customers match." : "No customers yet. They appear here when someone taps Send on the listings page."}</div>`;
}

function openLead(id) {
  const l = leads.find((x) => x.id === id); if (!l) return;
  const digits = String(l.phone || "").replace(/[^\d+]/g, "");
  const waNum = digits.replace(/^\+/, "").replace(/^0/, "263");
  const listingLinks = String(l.message || "").match(/https:\/\/www\.remax\.co\.za\/\S+?(?=[.\s]|$)/g) || [];
  $("panel").innerHTML = `
    <div class="row"><h2>${esc(l.name)}</h2><button class="icon-btn" id="close" type="button">Done</button></div>
    <div class="actions">
      <a href="tel:${esc(digits)}" aria-disabled="${!digits}">Call</a>
      <a class="wa" href="https://wa.me/${esc(waNum)}" target="_blank" rel="noopener" aria-disabled="${!digits}">WhatsApp</a>
      <a href="mailto:${esc(l.email)}" aria-disabled="${!l.email}">Email</a>
    </div>
    <dl>
      ${l.budget ? `<dt>Budget</dt><dd><b>${esc(l.budget)}</b></dd>` : ""}
      ${l.area ? `<dt>Area</dt><dd>${esc(l.area)}</dd>` : ""}
      ${l.subject ? `<dt>Looking to</dt><dd>${esc(l.subject)}</dd>` : ""}
      ${l.phone ? `<dt>Mobile</dt><dd>${esc(l.phone)}</dd>` : ""}
      ${l.email ? `<dt>Email</dt><dd>${esc(l.email)}</dd>` : ""}
      ${l.listings ? `<dt>Listings</dt><dd>${listingLinks.length ? listingLinks.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc((l.listings.split(", ")[i]) || "View listing")}</a>`).join("<br>") : esc(l.listings)}</dd>` : ""}
      <dt>Came in</dt><dd>${esc(l.created_at)} UTC via ${esc(l.channel || "form")}</dd>
    </dl>
    ${l.message ? `<p class="quote">${esc(l.message)}</p>` : ""}
    ${l.questions ? `<div class="saved" style="margin:0 0 4px">What they asked the assistant</div><p class="quote">${esc(l.questions)}</p>` : ""}
    <label class="f">Status<select id="st">${statuses.map((s) => `<option${s === (l.status || "New") ? " selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
    <label class="f">Notes<textarea id="notes" rows="4" placeholder="e.g. Wants to view Saturday, pre-approved for $250k">${esc(l.notes || "")}</textarea></label>
    <div class="saved" id="saved"></div>`;
  $("sheet").hidden = false;
  document.body.style.overflow = "hidden";
  $("close").onclick = closeSheet;
  let t;
  const save = async () => {
    $("saved").textContent = "Saving…";
    try {
      await api("POST", { id: l.id, status: $("st").value, notes: $("notes").value });
      l.status = $("st").value; l.notes = $("notes").value;
      $("saved").textContent = "Saved"; render();
    } catch (e) { $("saved").textContent = "Not saved: " + e.message; }
  };
  $("st").onchange = save;
  $("notes").oninput = () => { clearTimeout(t); $("saved").textContent = ""; t = setTimeout(save, 800); };
}
function closeSheet() { $("sheet").hidden = true; document.body.style.overflow = ""; }

$("unlock").onclick = () => { const p = $("pin").value.trim(); if (!p) return; setPin(p); $("pin").value = ""; load(); };
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") $("unlock").click(); });
$("logout").onclick = () => { setPin(""); leads = []; showLock(); };
$("refresh").onclick = load;
$("q").oninput = render;
$("stats").onclick = (e) => { const b = e.target.closest(".stat"); if (b) { filter = b.dataset.f; render(); } };
$("list").onclick = (e) => { const c = e.target.closest(".lead"); if (c) openLead(Number(c.dataset.id)); };
$("sheet").onclick = (e) => { if (e.target === $("sheet")) closeSheet(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && getPin() && $("sheet").hidden) load(); });

getPin() ? load() : showLock();
</script>
</body>
</html>
